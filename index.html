<script>
(function(){
  /* Shell fills the layout viewport (innerHeight / 100dvh). visualViewport is
     only used to nudge in-flow footers when they are actually covered. */
  function setShell(){
    try{
      var r=document.documentElement;
      var layout=window.innerHeight||0;
      var app=layout? (layout+"px") : "100dvh";
      r.style.setProperty("--app-h", app);
      /* leftover --vvh must not shrink the shell if any rule still references it */
      r.style.setProperty("--vvh", app);
      var vv=window.visualViewport, top=0, nudge=0;
      if(vv && vv.height){
        top=vv.offsetTop||0;
        nudge=Math.max(0, layout-(top+vv.height));
        if(nudge<1) nudge=0;
      }
      r.style.setProperty("--vv-nudge", nudge+"px");
      r.style.setProperty("--vv-bottom-gap", nudge+"px");
      r.style.setProperty("--vv-top", top+"px");
    }catch(e){}
  }
  setShell();
  window.addEventListener("resize", setShell);
  window.addEventListener("orientationchange", setShell);
  if(window.visualViewport){
    visualViewport.addEventListener("resize", setShell);
    visualViewport.addEventListener("scroll", setShell);
  }
})();
</script>
